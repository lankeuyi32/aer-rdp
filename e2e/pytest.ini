[pytest]
testpaths = tests tests_self
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    tier1: Tier 1 feature equivalence-class tests
    tier2: Tier 2 boundary, negative, and fault-injection tests
    tier3: Tier 3 cross-feature pairwise combination tests
    tier4: Tier 4 real-world end-to-end application scenario tests
    selftest: Binary-independent E2E harness self-tests
