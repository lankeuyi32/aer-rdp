[workspace]
resolver = "2"
members = [
    "crates/rdp-core",
    "crates/rdp-ffi",
    "crates/rdp-test-server",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
bytes = "1.12"
const-oid = "0.9"
der = "0.7"
httparse = "1.10"
ring = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
spki = "0.7"
thiserror = "2.0"
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
tracing = "0.1"
x509-cert = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
ironrdp-core = "0.3"
ironrdp-pdu = "0.11"
ironrdp-connector = "0.12"
ironrdp-session = "0.13"
ironrdp-egfx = { version = "0.5", features = ["openh264-bundled"] }
ironrdp-graphics = "0.11"
ironrdp-input = "0.9"
ironrdp-svc = "0.10"
ironrdp-dvc = "0.10"
ironrdp-rdpdr = "0.9"
ironrdp-rdpsnd = "0.11"
ironrdp-displaycontrol = "0.10"
ironrdp-echo = "0.6"
ironrdp-acceptor = "0.12"
ironrdp-tokio = "0.12"
ironrdp-tls = { version = "0.3", default-features = false, features = ["rustls-ring"] }
